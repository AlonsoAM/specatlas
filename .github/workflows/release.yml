name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm -r build
      - name: Publicar paquetes npm (orden topológico)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          pnpm --filter @specatlas/render publish --access public --no-git-checks
          pnpm --filter @specatlas/core publish --access public --no-git-checks
          pnpm --filter @specatlas/adapters publish --access public --no-git-checks
          pnpm --filter @specatlas/lsp publish --access public --no-git-checks
          pnpm --filter specatlas publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter specatlas-vscode build
      - name: Empaquetar .vsix
        run: pnpm --filter specatlas-vscode exec vsce package --no-dependencies
      - name: Publicar en VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: pnpm --filter specatlas-vscode exec vsce publish --packagePath specatlas-vscode-*.vsix -p "$VSCE_PAT"
      - name: Publicar en Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: pnpm --filter specatlas-vscode exec ovsx publish specatlas-vscode-*.vsix -p "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: specatlas-vscode-vsix
          path: packages/vscode/specatlas-vscode-*.vsix
