name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publicación sin tokens (trusted publishing de npm): el job pide un
      # token OIDC de corta vida en lugar de guardar credenciales en secretos.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # El intercambio OIDC necesita npm >= 11.5.1; el que trae Node es anterior.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      - name: Publicar paquetes npm (idempotente, orden topológico)
        run: |
          set -e
          # Dos vías: el token OIDC que GitHub emite para este job (trusted
          # publishing, sin secretos) o, si no está disponible, NPM_TOKEN.
          # Los secretos se enmascaran en las expresiones `if`, así que la
          # comprobación vive aquí dentro: antes el paso se saltaba siempre.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "Publicando con trusted publishing (OIDC), sin tokens."
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publicando con NPM_TOKEN."
          else
            echo "Ni OIDC ni NPM_TOKEN disponibles: no se publica en npm."
            exit 0
          fi
          npm --version
          publish() {
            dir="$1"; name="$2"
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version ya está publicado, se omite"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          }
          publish packages/render @specatlas/render
          publish packages/core @specatlas/core
          publish packages/adapters @specatlas/adapters
          publish packages/lsp @specatlas/lsp
          publish packages/cli specatlas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Empaquetar .vsix
        working-directory: packages/vscode
        run: ./node_modules/.bin/vsce package --no-dependencies --baseImagesUrl https://github.com/AlonsoAM/specatlas/raw/HEAD/packages/vscode --baseContentUrl https://github.com/AlonsoAM/specatlas/blob/HEAD/packages/vscode
      - name: Publicar en VS Code Marketplace (idempotente)
        working-directory: packages/vscode
        run: |
          set -e
          if [ -z "$VSCE_PAT" ]; then
            echo "Sin VSCE_PAT configurado: no se publica en el Marketplace."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if ./node_modules/.bin/vsce show specatlas.specatlas-vscode --json 2>/dev/null | grep -q "\"$version\""; then
            echo "specatlas-vscode $version ya está publicado, se omite"
            exit 0
          fi
          output=$(./node_modules/.bin/vsce publish --packagePath "specatlas-vscode-$version.vsix" -p "$VSCE_PAT" 2>&1) && { echo "$output"; exit 0; }
          echo "$output"
          if echo "$output" | grep -qi "already exists"; then
            echo "specatlas-vscode $version ya existía en el Marketplace (propagación pendiente), se omite"
            exit 0
          fi
          exit 1
      - name: Publicar en Open VSX (idempotente)
        working-directory: packages/vscode
        run: |
          set -e
          if [ -z "$OVSX_PAT" ]; then
            echo "Sin OVSX_PAT configurado: no se publica en Open VSX."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          # `ovsx get` devuelve éxito sin credencial válida: se consulta la API.
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/specatlas/specatlas-vscode/$version")
          if [ "$status" = "200" ]; then
            echo "specatlas-vscode $version ya está en Open VSX, se omite"
            exit 0
          fi
          output=$(./node_modules/.bin/ovsx publish "specatlas-vscode-$version.vsix" -p "$OVSX_PAT" 2>&1) && { echo "$output"; exit 0; }
          echo "$output"
          if echo "$output" | grep -qiE "already (exists|published|present)"; then
            echo "specatlas-vscode $version ya existía en Open VSX (propagación pendiente), se omite"
            exit 0
          fi
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: specatlas-vscode-vsix
          path: packages/vscode/specatlas-vscode-*.vsix
