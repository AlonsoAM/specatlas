name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm -r build
      - name: Publicar paquetes npm (idempotente, orden topológico)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          set -e
          publish() {
            dir="$1"; name="$2"
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version ya está publicado, se omite"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          }
          publish packages/render @specatlas/render
          publish packages/core @specatlas/core
          publish packages/adapters @specatlas/adapters
          publish packages/lsp @specatlas/lsp
          publish packages/cli specatlas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter specatlas-vscode build
      - name: Empaquetar .vsix
        run: pnpm --filter specatlas-vscode exec vsce package --no-dependencies
      - name: Publicar en VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: pnpm --filter specatlas-vscode exec vsce publish --packagePath specatlas-vscode-*.vsix -p "$VSCE_PAT"
      - name: Publicar en Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: pnpm --filter specatlas-vscode exec ovsx publish specatlas-vscode-*.vsix -p "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: specatlas-vscode-vsix
          path: packages/vscode/specatlas-vscode-*.vsix
