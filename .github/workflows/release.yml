name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      - name: Publicar paquetes npm (idempotente, orden topológico)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          set -e
          publish() {
            dir="$1"; name="$2"
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version ya está publicado, se omite"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          }
          publish packages/render @specatlas/render
          publish packages/core @specatlas/core
          publish packages/adapters @specatlas/adapters
          publish packages/lsp @specatlas/lsp
          publish packages/cli specatlas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Empaquetar .vsix
        working-directory: packages/vscode
        run: ./node_modules/.bin/vsce package --no-dependencies --baseImagesUrl https://github.com/AlonsoAM/specatlas/raw/HEAD/packages/vscode --baseContentUrl https://github.com/AlonsoAM/specatlas/blob/HEAD/packages/vscode
      - name: Publicar en VS Code Marketplace (idempotente)
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: packages/vscode
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          if ./node_modules/.bin/vsce show specatlas.specatlas-vscode --json 2>/dev/null | grep -q "\"$version\""; then
            echo "specatlas-vscode $version ya está publicado, se omite"
            exit 0
          fi
          output=$(./node_modules/.bin/vsce publish --packagePath "specatlas-vscode-$version.vsix" -p "$VSCE_PAT" 2>&1) && { echo "$output"; exit 0; }
          echo "$output"
          if echo "$output" | grep -qi "already exists"; then
            echo "specatlas-vscode $version ya existía en el Marketplace (propagación pendiente), se omite"
            exit 0
          fi
          exit 1
      - name: Publicar en Open VSX (idempotente)
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: packages/vscode
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          if ./node_modules/.bin/ovsx get specatlas.specatlas-vscode --version "$version" >/dev/null 2>&1; then
            echo "specatlas-vscode $version ya está en Open VSX, se omite"
            exit 0
          fi
          output=$(./node_modules/.bin/ovsx publish "specatlas-vscode-$version.vsix" -p "$OVSX_PAT" 2>&1) && { echo "$output"; exit 0; }
          echo "$output"
          if echo "$output" | grep -qiE "already (exists|published|present)"; then
            echo "specatlas-vscode $version ya existía en Open VSX (propagación pendiente), se omite"
            exit 0
          fi
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: specatlas-vscode-vsix
          path: packages/vscode/specatlas-vscode-*.vsix
