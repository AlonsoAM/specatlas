name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      # El gate del flujo SDD con el código de este mismo commit.
      - run: pnpm satlas adapters --check
      - run: pnpm satlas ci

  sdd:
    # Además, la Action publicada se ejercita sobre este repo en cada propuesta.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: latest
          strict: 'false'
          upload: 'true'
